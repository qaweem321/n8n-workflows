services:
  n8n:
    image: n8nio/n8n:2.43.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env (see .env.example)}
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./credentials:/credentials:ro
    depends_on:
      - llm
      - mailpit

  # Free local AI with an OpenAI-compatible API (http://llm:8080/v1). No API key, no account.
  # Downloads the model (about 2.1 GB) on first start and keeps it in the llm_models volume.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11561
    restart: unless-stopped
    command:
      - --hf-repo
      - Qwen/Qwen2.5-3B-Instruct-GGUF
      - --hf-file
      - qwen2.5-3b-instruct-q4_k_m.gguf
      - --ctx-size
      - "4096"
      - --jinja
    volumes:
      - llm_models:/root/.cache

  # Catches every email the workflows send. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  n8n_data:
  llm_models:
